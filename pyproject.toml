[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-infer"
version = "0.1.0"
description = "Bayesian stellar parameter inference using MESA stellar evolution models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Niall Miller", email = "niall.j.miller@gmail.com"}
]
maintainers = [
    {name = "Niall Miller", email = "niall.j.miller@gmail.com"}
]
keywords = [
    "MESA",
    "stellar evolution",
    "astrophysics",
    "Bayesian inference",
    "stellar parameters",
    "genetic algorithm",
    "MCMC",
    "SMC-DEMC",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "deap>=1.3.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.4.0",
    "corner>=2.2.0",
    "seaborn>=0.11.0",
]
full = [
    "matplotlib>=3.4.0",
    "corner>=2.2.0",
    "seaborn>=0.11.0",
    "astropy>=5.0",
    "mesa_reader>=0.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "ruff>=0.0.200",
    "mypy>=0.990",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/nialljmiller/MESA_infer"
Documentation = "https://mesa-infer.readthedocs.io"
Repository = "https://github.com/nialljmiller/MESA_infer"
Issues = "https://github.com/nialljmiller/MESA_infer/issues"
Changelog = "https://github.com/nialljmiller/MESA_infer/blob/main/CHANGELOG.md"

[project.scripts]
mesa-infer = "mesa_infer.cli:main"

[tool.setuptools]
packages = ["mesa_infer", "mesa_infer.samplers", "mesa_infer.likelihood", "mesa_infer.utils"]

[tool.setuptools.package-data]
mesa_infer = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["mesa_infer"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=mesa_infer --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["mesa_infer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
